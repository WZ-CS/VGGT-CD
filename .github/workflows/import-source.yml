name: Merge source repository history

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  merge-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge original Git history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source https://github.com/sumu870/VGGT-CD.git
          git fetch source main
          git merge --allow-unrelated-histories --strategy=ours source/main -m "Merge original history from sumu870/VGGT-CD"
          git push origin main
